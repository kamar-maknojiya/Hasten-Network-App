  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  url_launcher: ^6.3.0
  fluttertoast: ^8.2.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.4.2
  firebase_core: ^3.15.0
  hive_flutter: ^1.1.0
  lottie: ^3.1.0
  intl: ^0.20.2
