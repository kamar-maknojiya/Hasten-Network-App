name: vision_broadband
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5   # flutter_windows_3.41.8-stable_dart_3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.3.0
  shared_preferences: ^2.2.2
  device_info_plus: ^11.0.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
